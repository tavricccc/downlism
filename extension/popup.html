<meta charset="utf-8" />
<title>Downlism</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #1a1a1a;
    --muted: #5c5c5c;
    --line: rgba(0, 0, 0, 0.1);
    --ground: #f7f7f5;
    --panel: #ffffff;
    --live: #1f7a5a;
    --down: #a33a30;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ececec;
      --muted: #a0a0a0;
      --line: rgba(255, 255, 255, 0.12);
      --ground: #1c1c1c;
      --panel: #242424;
      --live: #59c79c;
      --down: #e08b82;
    }
  }

  body {
    margin: 0;
    width: 288px;
    font: 13px/1.5 "Segoe UI Variable Text", "Microsoft JhengHei UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--ground);
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 16px 10px;
  }

  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  #state {
    font-size: 12px;
    color: var(--muted);
  }

  #state[data-running="true"] { color: var(--live); }
  #state[data-running="false"] { color: var(--down); }

  .rows {
    background: var(--panel);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 16px;
  }

  .row + .row { border-top: 1px solid var(--line); }

  .row label { flex: 1; }

  .row p {
    margin: 2px 0 0;
    font-size: 11.5px;
    color: var(--muted);
  }

  input[type="number"] {
    width: 62px;
    padding: 4px 6px;
    font: inherit;
    font-size: 12px;
    text-align: right;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--live);
  }

  footer {
    padding: 10px 16px 14px;
    font-size: 11.5px;
    color: var(--muted);
  }

  section {
    padding: 12px 16px 4px;
  }

  h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .empty {
    margin: 0 0 10px;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--muted);
  }

  /* Each find is a button, not a row with a button in it: the whole entry is the target, and
     at this width a separate control would leave the label two words wide. */
  .found {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    margin-bottom: 4px;
    padding: 7px 9px;
    font: inherit;
    text-align: left;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    cursor: pointer;
  }

  .found:hover:not(:disabled) { border-color: var(--muted); }

  .found:disabled { cursor: default; opacity: 0.7; }

  .found .label {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .found .meta {
    flex: none;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  .found[data-result="taken"] { border-color: var(--live); }
  .found[data-result="taken"] .meta::after { content: " ✓"; color: var(--live); }
  .found[data-result="failed"] { border-color: var(--down); }

  #page-video {
    width: 100%;
    margin: 6px 0 2px;
    padding: 9px;
    font: inherit;
    font-weight: 600;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    cursor: pointer;
  }

  #page-video:hover:not(:disabled) { border-color: var(--muted); }

  #page-video:disabled { cursor: default; opacity: 0.5; }

  :focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
  }
</style>

<header>
  <h1>Downlism</h1>
  <span id="state">檢查中</span>
</header>

<section>
  <h2>這個頁面上的影片</h2>
  <div id="media"></div>
  <button type="button" id="page-video">整頁交給 yt-dlp 下載</button>
</section>

<div class="rows">
  <div class="row">
    <label for="enabled">接手下載</label>
    <input type="checkbox" id="enabled" />
  </div>
  <div class="row">
    <label for="minimum">
      最小檔案
      <p>小於這個大小的檔案交給瀏覽器</p>
    </label>
    <input type="number" id="minimum" min="0" step="1" aria-describedby="unit" />
  </div>
</div>

<footer id="unit">最小檔案單位為 MB。設定立即生效。</footer>

<script src="popup.js"></script>
