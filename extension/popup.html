<meta charset="utf-8" />
<title>Downlism</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #1a1a1a;
    --muted: #5c5c5c;
    --line: rgba(0, 0, 0, 0.1);
    --ground: #f7f7f5;
    --panel: #ffffff;
    --live: #1f7a5a;
    --down: #a33a30;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ececec;
      --muted: #a0a0a0;
      --line: rgba(255, 255, 255, 0.12);
      --ground: #1c1c1c;
      --panel: #242424;
      --live: #59c79c;
      --down: #e08b82;
    }
  }

  body {
    margin: 0;
    width: 352px;
    font: 13px/1.5 "Segoe UI Variable Text", "Microsoft JhengHei UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--ground);
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 16px 10px;
  }

  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  #state {
    font-size: 12px;
    color: var(--muted);
  }

  #state[data-running="true"] { color: var(--live); }
  #state[data-running="false"] { color: var(--down); }

  .rows {
    background: var(--panel);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 16px;
  }

  .row + .row { border-top: 1px solid var(--line); }

  .row label { flex: 1; }

  .row p {
    margin: 2px 0 0;
    font-size: 11.5px;
    color: var(--muted);
  }

  input[type="number"] {
    width: 62px;
    padding: 4px 6px;
    font: inherit;
    font-size: 12px;
    text-align: right;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--live);
  }

  footer {
    padding: 10px 16px 14px;
    font-size: 11.5px;
    color: var(--muted);
  }

  section {
    padding: 12px 16px 4px;
  }

  h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .empty {
    margin: 0 0 10px;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--muted);
  }

  /* Each find is a button, not a row with a button in it: the whole entry is the target, and
     at this width a separate control would leave the label two words wide. */
  .found {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    margin-bottom: 4px;
    padding: 7px 9px;
    font: inherit;
    text-align: left;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    cursor: pointer;
  }

  .found:hover:not(:disabled) { border-color: var(--muted); }

  .found:disabled { cursor: default; opacity: 0.7; }

  .found .label {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .found .meta {
    flex: none;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  .found[data-result="taken"] { border-color: var(--live); }
  .found[data-result="taken"] .meta::after { content: " ✓"; color: var(--live); }
  .found[data-result="failed"] { border-color: var(--down); }

  #page-video {
    width: 100%;
    margin: 6px 0 2px;
    padding: 9px;
    font: inherit;
    font-weight: 600;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    cursor: pointer;
  }

  #page-video:hover:not(:disabled) { border-color: var(--muted); }

  #page-video:disabled { cursor: default; opacity: 0.5; }

  details { padding: 12px 16px; }
  summary { cursor: pointer; font-weight: 600; }
  details label { display: block; margin-top: 14px; }
  details p { color: var(--muted); font-size: 12px; margin: 4px 0; }
  textarea { box-sizing: border-box; width: 100%; min-height: 58px; resize: vertical; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
  #save-status { margin: 0; padding: 0 16px; color: var(--down); }
  ::selection { background: var(--ink); color: var(--ground); }
  input, textarea { caret-color: var(--ink); }
  :focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
  }
</style>

<header>
  <h1>Downlism</h1>
  <span id="state">檢查中</span>
</header>

<section>
  <h2>這個頁面上的影片</h2>
  <div id="media"></div>
  <button type="button" id="page-video">整頁交給 yt-dlp 下載</button>
</section>

<div class="rows">
  <div class="row">
    <label for="enabled">接手下載</label>
    <input type="checkbox" id="enabled" />
  </div>
  <div class="row">
    <label for="minimum">
      最小檔案
      <p>小於這個大小的檔案交給瀏覽器</p>
    </label>
    <input type="number" id="minimum" min="0" max="10240" step="any" aria-describedby="unit" />
  </div>
</div>

<details>
  <summary>自訂接手規則</summary>
  <label for="sniff"><input type="checkbox" id="sniff" /> 偵測頁面上的影片</label>
  <label for="skip">不接手的副檔名</label>
  <p id="skip-help">以逗號分隔。建議保留 json、html，避免把網頁或 API 回應當檔案。</p>
  <textarea id="skip" maxlength="2100" aria-describedby="skip-help"></textarea>
  <label for="blocked">不自動接手的網站</label>
  <p id="host-help">每行一個網域，例如 example.com，同時包含子網域。不要填 https:// 或路徑。</p>
  <textarea id="blocked" maxlength="10000" aria-describedby="host-help" placeholder="example.com"></textarea>
  <label for="allowed">只自動接手這些網站（選填）</label>
  <p>留空表示不限網站。排除規則優先；MEGA 永遠由網頁處理。</p>
  <textarea id="allowed" maxlength="10000" aria-describedby="host-help"></textarea>
  <p>關閉「接手下載」即為手動模式；右鍵「用 Downlism 下載」仍可使用。POST、blob 和無法確認來源的下載不會自動接手。</p>
</details>
<p id="save-status" role="status" aria-live="polite"></p>
<footer id="unit">最小檔案單位為 MiB，可填小數。設定立即儲存，錯誤會顯示於上方。</footer>

<script src="popup.js"></script>
